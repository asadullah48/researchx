version: '3.8'

services:
  researchx-gateway:
    build: .
    container_name: researchx-gateway
    ports:
      - "8011:8011"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: always
